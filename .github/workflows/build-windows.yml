name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ProfesjonalizatorAI --collect-all customtkinter ProfesjonalizatorAI.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ProfesjonalizatorAI-Windows
          path: dist/ProfesjonalizatorAI.exe
